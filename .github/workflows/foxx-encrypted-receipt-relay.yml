name: FOXX Encrypted Receipt Relay

on:
  push:
    branches:
      - main
    paths:
      - "foxx-command-bus/queue.json"

permissions:
  contents: write

concurrency:
  group: foxx-encrypted-receipt-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: [self-hosted, linux, x64, foxx-sovereign-relay]
    timeout-minutes: 12
    steps:
      - name: Checkout mailbox
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve new encrypted command ids
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          current="$(mktemp)"
          previous="$(mktemp)"
          jq -r '.commands[]?.requestId' foxx-command-bus/queue.json | sort -u > "$current"
          if git cat-file -e "$GITHUB_SHA^:foxx-command-bus/queue.json" 2>/dev/null; then
            git show "$GITHUB_SHA^:foxx-command-bus/queue.json" | jq -r '.commands[]?.requestId' | sort -u > "$previous"
          else
            : > "$previous"
          fi
          comm -23 "$current" "$previous" > /tmp/foxx-new-ids
          cat /tmp/foxx-new-ids
          test -s /tmp/foxx-new-ids

      - name: Collect encrypted sovereign receipts
        shell: bash
        env:
          RECEIPT_BASE: https://foxx-hands.206-81-26-161.sslip.io/chatgpt/receipt
        run: |
          set -euo pipefail
          mkdir -p foxx-command-bus/receipts
          while IFS= read -r request_id; do
            test -n "$request_id"
            case "$request_id" in
              *[!A-Za-z0-9._:-]* ) echo "Invalid request id" >&2; exit 64 ;;
            esac
            target="foxx-command-bus/receipts/${request_id}.json"
            tmp="${target}.tmp"
            ready=0
            for attempt in $(seq 1 120); do
              code="$(curl -ksS --max-time 15 -o "$tmp" -w '%{http_code}' "$RECEIPT_BASE/$request_id" || true)"
              if [ "$code" = "200" ] && jq -e '.version == 1 and .requestId == "'"$request_id"'" and .algorithm == "AES-256-GCM"' "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$target"
                ready=1
                break
              fi
              rm -f "$tmp"
              sleep 5
            done
            test "$ready" = "1" || { echo "Receipt timeout: $request_id" >&2; exit 1; }
          done < /tmp/foxx-new-ids

      - name: Commit encrypted receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FOXX Receipt Relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foxx-command-bus/receipts
          git diff --cached --quiet && exit 0
          git commit -m "receipt(foxx): encrypted sovereign result"
          git push
