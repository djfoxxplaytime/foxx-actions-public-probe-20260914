name: FOXX Encrypted Receipt Relay

on:
  push:
    branches:
      - main
    paths:
      - "foxx-command-bus/queue.json"
      - ".github/workflows/foxx-encrypted-receipt-relay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foxx-encrypted-receipt-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout mailbox
        uses: actions/checkout@v4

      - name: Collect missing encrypted sovereign receipts
        shell: bash
        env:
          RECEIPT_BASE: https://foxx-hands.206-81-26-161.sslip.io/chatgpt/receipt
        run: |
          set -euo pipefail
          mkdir -p foxx-command-bus/receipts
          mapfile -t ids < <(jq -r '.commands[]?.requestId' foxx-command-bus/queue.json | sort -u)
          test "${#ids[@]}" -gt 0 || { echo "No encrypted commands queued"; exit 0; }

          found_missing=0
          for request_id in "${ids[@]}"; do
            case "$request_id" in
              *[!A-Za-z0-9._:-]* ) echo "Invalid request id: $request_id" >&2; exit 64 ;;
            esac

            target="foxx-command-bus/receipts/${request_id}.json"
            if [ -f "$target" ]; then
              echo "Receipt already present: $request_id"
              continue
            fi

            found_missing=1
            tmp="${target}.tmp"
            echo "Waiting for encrypted sovereign receipt: $request_id"
            ready=0
            for attempt in $(seq 1 120); do
              code="$(curl -ksS --max-time 15 -o "$tmp" -w '%{http_code}' "$RECEIPT_BASE/$request_id" || true)"
              if [ "$code" = "200" ] && jq -e                 --arg id "$request_id"                 '.version == 1 and .requestId == $id and .algorithm == "AES-256-GCM" and (.ciphertext | type == "string")'                 "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$target"
                echo "Encrypted receipt collected: $request_id"
                ready=1
                break
              fi
              rm -f "$tmp"
              sleep 5
            done
            test "$ready" = "1" || { echo "Receipt timeout: $request_id" >&2; exit 1; }
          done

          if [ "$found_missing" = "0" ]; then
            echo "All encrypted receipts already present"
          fi

      - name: Commit encrypted receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FOXX Receipt Relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foxx-command-bus/receipts
          git diff --cached --quiet && { echo "No new receipts"; exit 0; }
          git commit -m "receipt(foxx): encrypted sovereign result"
          git push
